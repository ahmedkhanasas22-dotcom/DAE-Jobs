            answered = false;

            q.options.forEach((option, index) => {

                li.className = 'option-item';

                li.style.padding = '10px 14px';

                li.innerText = option;
                li.onclick = () => selectOption(index, li);
                optionsListEl.appendChild(li);
            });
        }

        function selectOption(selectedIndex, element) {
            if (answered) return;
            answered = true;
            
            const q = quizData[currentQuestion];
            const optionItems = optionsListEl.children;
            
            if (selectedIndex === q.answer) {
                element.style.background = '#166534';
                element.style.borderColor = '#22c55e';
                score++;
            } else {
                element.style.background = '#7f1d1d';
                element.style.borderColor = '#ef4444';
                optionItems[q.answer].style.background = '#166534';
                optionItems[q.answer].style.borderColor = '#22c55e';
            }
            
            if (currentQuestion < quizData.length - 1) {
                nextBtnEl.innerText = "Next Question";
            } else {
                nextBtnEl.innerText = "View Results";
            }
            nextBtnEl.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();

            }
        }

            quizCardEl.style.display = 'none';

        function downloadMCQsAsText() {
            let textContent = "ET-326 AC Machines - DAE Examination Prep Portal\n";
            textContent += "==================================================\n\n";

            quizData.forEach((q, index) => {
                textContent += `Question ${index + 1} [Topic: ${q.topic}]\n`;
                textContent += `${q.question}\n`;
                q.options.forEach((opt, optIndex) => {
                    let marker = (optIndex === q.answer) ? " (Correct Answer ✓)" : "";
                    textContent += `  - ${opt}${marker}\n`;
                });
                textContent += "\n--------------------------------------------------\n\n";
            });

            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ET-326-MCQs-Readable.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
