        let currentQuestion = 0;

        const optionsListEl = document.getElementById('options-list');
        const nextBtnEl = document.getElementById('next-btn');
        const quizCardEl = document.getElementById('quiz-card');
        const resultCardEl = document.getElementById('result-card');
        const scoreTextEl = document.getElementById('score-text');

        function loadQuestion() {
            answered = false;
            nextBtnEl.style.display = 'none';
            const q = quizData[currentQuestion];
            
            qNumberEl.innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
            qTopicEl.innerText = `Topic: ${q.topic}`;
            questionTextEl.innerText = q.question;
            
            optionsListEl.innerHTML = '';
            q.options.forEach((option, index) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.style.background = '#1e293b';
                li.style.padding = '10px 14px';
                li.style.borderRadius = '8px';
                li.style.cursor = 'pointer';
                li.style.border = '1px solid #334155';
                li.style.color = '#e2e8f0';
                li.style.fontSize = '14px';
                li.innerText = option;
                li.onclick = () => selectOption(index, li);
                optionsListEl.appendChild(li);
            });
        }

        function selectOption(selectedIndex, element) {
            if (answered) return;
            answered = true;
            
            const q = quizData[currentQuestion];
            const optionItems = optionsListEl.children;
            
            if (selectedIndex === q.answer) {
                element.style.background = '#166534';
                element.style.borderColor = '#22c55e';
                score++;
            } else {
                element.style.background = '#7f1d1d';
                element.style.borderColor = '#ef4444';
                optionItems[q.answer].style.background = '#166534';
                optionItems[q.answer].style.borderColor = '#22c55e';
            }
            
            if (currentQuestion < quizData.length - 1) {
                nextBtnEl.innerText = "Next Question";
            } else {
                nextBtnEl.innerText = "View Results";
            }
            nextBtnEl.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizCardEl.style.display = 'none';
            resultCardEl.style.display = 'block';
            scoreTextEl.innerText = `Your Score: ${score} / ${quizData.length}`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            quizCardEl.style.display = 'block';
            resultCardEl.style.display = 'none';
            loadQuestion();
        }
