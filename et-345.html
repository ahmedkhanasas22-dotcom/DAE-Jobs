    let currentQuestion = 0;
    let score = 0;
    let isAnswered = false;

    const questionText = document.getElementById("questionText");
    const optionsList = document.getElementById("optionsList");
    const questionCount = document.getElementById("questionCount");
    const nextBtn = document.getElementById("nextBtn");
    const quizHeader = document.getElementById("quizHeader");

    function loadQuestion() {
        isAnswered = false;
        nextBtn.style.display = "none";
        quizHeader.style.display = "flex";
        
        const q = quizData[currentQuestion];
        questionText.innerText = q.question;
        questionCount.innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
        
        optionsList.innerHTML = "";
        q.options.forEach((opt, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerText = opt;
            li.onclick = () => selectOption(index, li);
            optionsList.appendChild(li);
        });
    }

    function selectOption(index, element) {
        if (isAnswered) return; 
        isAnswered = true;

        const q = quizData[currentQuestion];
        const optionsNodes = document.querySelectorAll(".option-item");

        optionsNodes.forEach(el => el.classList.add("disabled"));

        if (index === q.answer) {
            element.classList.add("correct");
            score++;
        } else {
            element.classList.add("incorrect");
            optionsNodes[q.answer].classList.add("correct"); 
        }

        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizHeader.style.display = "none";
        document.getElementById("questionBox").innerHTML = `
            <div class="score-container">
                <h2>ٹیسٹ مکمل ہو گیا ہے! 🎉</h2>
                <p>آپ کا اسکور: ${score} / ${quizData.length}</p>
                <div class="end-buttons">
                    <button class="action-btn btn-restart" onclick="restartQuiz()">دوبارہ ٹیسٹ شروع کریں</button>
                    <button class="action-btn btn-dashboard" onclick="goToDashboard()">مین ڈیش بورڈ پر جائیں</button>
                </div>
            </div>
        `;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        isAnswered = false;
        
        document.getElementById("questionBox").innerHTML = `
            <div class="question-text" id="questionText">Loading question...</div>
            <ul class="options-list" id="optionsList"></ul>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">اگلا سوال (Next Question)</button>
        `;
        
        loadQuestion();
    }

    function goToDashboard() {
        alert("مین ڈیش بورڈ پر جانے کا لنک یہاں لگایا جا سکتا ہے!");
    }

    loadQuestion();
</script>
