                    { q: "Access network connects:\nایکسیس نیٹ ورک کس کو کنیکٹ کرتا ہے؟", options: ["Core network - کور نیٹ ورک", "End user - آخری صارف", "Router - روٹر", "Server - سرور"], correct: 1 },
                    { q: "Local loop connects:\nلوکل لوپ کس کو کنیکٹ کرتا ہے؟", options: ["Exchange to user - ایکسچینج سے صارف", "User to user - صارف سے صارف", "Router to router - روٹر سے روٹر", "Server to client - سرور سے کلائنٹ"], correct: 0 },
                    { q: "Core network connects:\nکور نیٹ ورک کیا کنیکٹ کرتا ہے؟", options: ["Few nodes - چند نوڈز", "Many nodes - بہت سے نوڈز", "No nodes - کوئی نوڈ نہیں", "Single node - ایک نوڈ"], correct: 1 },
                    { q: "PDH stands for:\nPDH کا مکمل نام کیا ہے؟", options: ["Plesiochronous Digital Hierarchy - پلیسیو کرونس ڈیجیٹل ہائیرارکی", "Packet Data Hub - پیکٹ ڈیٹا ہب", "Power Data Hub - پاور ڈیٹا ہب", "None - کوئی نہیں"], correct: 0 },
                    { q: "SDH stands for:\nSDH کا مکمل نام کیا ہے؟", options: ["Synchronous Digital Hierarchy - سنکرونس ڈیجیٹل ہائیرارکی", "Signal Data Hub - سگنل ڈیٹا ہب", "System Data Hub - سسٹم ڈیٹا ہب", "None - کوئی نہیں"], correct: 0 },
                    { q: "Broadband provides:\nبراڈ بینڈ کیا فراہم کرتا ہے؟", options: ["Low speed - کم رفتار", "High speed - زیادہ رفتار", "No speed - کوئی رفتار نہیں", "Fixed speed - مقررہ رفتار"], correct: 1 },
                    { q: "Circuit switching establishes:\nسرکٹ سوئچنگ کیا قائم کرتی ہے؟", options: ["Permanent path - مستقل راستہ", "Temporary path - عارضی راستہ", "No path - کوئی راستہ نہیں", "Wireless path - وائرلیس راستہ"], correct: 1 },
                    { q: "Switching types are:\nسوئچنگ کی اقسام کتنی ہیں؟", options: ["1 - ایک", "2 - دو", "3 - تین", "4 - چار"], correct: 2 },
                    { q: "Subscriber line connects to:\nسبسکرائبر لائن کس سے جڑتی ہے؟", options: ["Router - روٹر", "Line card - لائن کارڈ", "Satellite - سیٹلائٹ", "Switch - سوئچ"], correct: 1 },
                    { q: "ISDN basic rate is:\nISDN کی بیسک ریٹ کیا ہے؟", options: ["2B+D", "30B+D", "Fiber - فائبر", "None - کوئی نہیں"], correct: 0 },
                    { q: "Primary rate ISDN contains:\nISDN پرائمری ریٹ میں کیا شامل ہوتا ہے؟", options: ["2B+D", "30B+D", "1B+D", "10B+D"], correct: 1 },
                    { q: "Switching system is used for:\nسوئچنگ سسٹم کس لیے استعمال ہوتا ہے؟", options: ["Storage - ذخیرہ", "Routing calls - کالز کو روٹ کرنا", "Power supply - پاور سپلائی", "Cooling - ٹھنڈک"], correct: 1 },
                    { q: "Packet switching divides data into:\nپیکٹ سوئچنگ ڈیٹا کو کس میں تقسیم کرتی ہے؟", options: ["Signals - سگنلز", "Frames - فریمز", "Packets - پیکٹس", "Blocks - بلاکس"], correct: 2 },
                    { q: "Time slot is used in:\nٹائم سلاٹ کہاں استعمال ہوتا ہے؟", options: ["FDM - ایف ڈی ایم", "TDM - ٹی ڈی ایم", "AM - اے ایم", "FM - ایف ایم"], correct: 1 },
                    { q: "Noise in communication causes:\nکمیونیکیشن میں نوائز کیا پیدا کرتا ہے؟", options: ["Clarity - وضاحت", "Distortion - بگاڑ", "Amplification – ایمپلی فکیشن", "Modulation – ماڈیولیشن"], correct: 1 },
                    { q: "Bandwidth means:\nبینڈ وڈتھ سے کیا مراد ہے؟", options: ["Power - طاقت", "Frequency range - فریکوئنسی کی حد", "Voltage - وولٹیج", "Resistance - مزاحمت"], correct: 1 },
                    { q: "Optical fiber works on:\nآپٹیکل فائبر کس اصول پر کام کرتا ہے؟", options: ["Reflection - انعکاس", "Refraction - انعطاف", "Total internal reflection – مکمل اندرونی انعکاس", "Diffraction - ڈیفریکشن"], correct: 2 },
                    { q: "Repeater is used to:\nریپیٹر کس لیے استعمال ہوتا ہے؟", options: ["Reduce signal - سگنل کم کرنا", "Amplify signal - سگنل بڑھانا", "Store data - ڈیٹا محفوظ کرنا", "Filter noise - شور فلٹر کرنا"], correct: 1 },
                    { q: "Router works at:\nروٹر کس لیئر پر کام کرتا ہے؟", options: ["Physical layer - فزیکل لیئر", "Data link layer - ڈیٹا لنک لیئر", "Network layer - نیٹ ورک لیئر", "Application layer - ایپلیکیشن لیئر"], correct: 2 },
                    { q: "Modem converts:\nموڈیم کیا تبدیل کرتا ہے؟", options: ["Digital to analog - ڈیجیٹل کو اینالاگ", "Analog to digital - اینالاگ کو ڈیجیٹل", "Both - دونوں", "None - کوئی نہیں"], correct: 2 },
                    { q: "Transmission media are:\nٹرانسمیشن میڈیا کیا ہوتے ہیں؟", options: ["Wired - وائرڈ", "Wireless - وائرلیس", "Both - دونوں", "None - کوئی نہیں"], correct: 2 },
                    { q: "Twisted pair cable is used in:\nٹوسٹڈ پیئر کیبل کہاں استعمال ہوتی ہے؟", options: ["Telephony - ٹیلی فونی", "Satellite - سیٹلائٹ", "Radio - ریڈیو", "Fiber - فائبر"], correct: 0 },
                    { q: "Propagation delay depends on:\nپروپیگیشن ڈیلے کس پر منحصر ہوتا ہے؟", options: ["Distance - فاصلہ", "Speed - رفتار", "Medium - میڈیم", "All - یہ سب"], correct: 3 },
                    { q: "Signal distortion occurs due to:\nسگنل ڈسٹورشن کس وجہ سے ہوتا ہے؟", options: ["Noise - شور", "Attenuation - اٹینیوایشن", "Interference - مداخلت", "All - سب"], correct: 3 },
                    { q: "Wireless communication uses:\nوائرلیس کمیونیکیشن کس کو استعمال کرتی ہے؟", options: ["Cable - کیبل", "Fiber - فائبر", "Air - ہوا", "Copper - کاپر"], correct: 2 },
                    { q: "Satellite orbit is:\nسیٹلائٹ کا مدار کیا ہوتا ہے؟", options: ["Circular - دائرہ نما", "Elliptical - بیضوی", "Both - دونوں", "None - کوئی نہیں"], correct: 2 },
                    { q: "Multiplexer combines:\nملٹی پلیکسر کیا ملاتا ہے؟", options: ["Signals - سگنلز", "Data - ڈیٹا", "Channels - چینلز", "All - یہ سب"], correct: 3 },
                    { q: "Demultiplexer separates:\nڈی ملٹی پلیکسر کیا الگ کرتا ہے؟", options: ["Signals – سگنلز", "Data - ڈیٹا", "Channels - چینلز", "All - یہ سب"], correct: 3 },
                    { q: "Digital communication is:\nڈیجیٹل کمیونیکیشن کیا ہے؟", options: ["Continuous - مسلسل", "Discrete - منقطع", "Analog - اینالاگ", "None - کوئی نہیں"], correct: 1 },
                    { q: "Analog communication is:\nاینالاگ کمیونیکیشن کیا ہے؟", options: ["Discrete - منقطع", "Continuous - مسلسل", "Binary - بائنری", "None - کوئی نہیں"], correct: 1 }
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('book') || 'et326';

        const currentBook = allBooks[bookId] || allBooks['et326'];
        const questions = currentBook.questions;

        document.getElementById('bookTitleDisplay').innerText = currentBook.title;

        let currentIndex = 0;
        let userAnswers = {};

        function loadQuestion() {
            const q = questions[currentIndex];
            const cardBox = document.getElementById('questionCardBox');
            
            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                let statusClass = '';
                if (userAnswers[currentIndex] !== undefined) {
                    if (idx === q.correct) {
                        statusClass = 'correct disabled';
                    } else if (userAnswers[currentIndex] === idx) {
                        statusClass = 'wrong disabled';
                    } else {
                        statusClass = 'disabled';
                    }
                }
                
                optionsHtml += `<div class="option-item ${statusClass}" onclick="selectOption(${idx})">
                    <span>${opt}</span>
                    <i class="fa-regular ${idx === q.correct && userAnswers[currentIndex] !== undefined ? 'fa-circle-check' : 'fa-circle'}"></i>
                </div>`;
            });

            cardBox.innerHTML = `
                <div class="q-number">Question ${currentIndex + 1} of ${questions.length}</div>
                <div class="q-text">${q.q}</div>
                <div class="options-list">${optionsHtml}</div>
            `;

            document.getElementById('progressIndicator').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = userAnswers[currentIndex] === undefined;

            if (currentIndex === questions.length - 1) {
                nextBtn.innerHTML = 'Finish Test <i class="fa-solid fa-flag-checkered"></i>';
            } else {
                nextBtn.innerHTML = 'Next <i class="fa-solid fa-arrow-right"></i>';
            }
        }

        window.selectOption = function(optIdx) {
            if (userAnswers[currentIndex] !== undefined) return;
            
            userAnswers[currentIndex] = optIdx;
            document.getElementById('nextBtn').disabled = false;
            loadQuestion();
        }

        window.nextQuestion = function() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        window.prevQuestion = function() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizContainer').style.display = 'none';
            let score = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.correct) {
                    score++;
                }
            });

            document.getElementById('finalScoreText').innerText = `${score} / ${questions.length}`;
            document.getElementById('resultMessageText').innerText = `You answered ${score} questions correctly out of ${questions.length} total questions in ${currentBook.title}.`;
            document.getElementById('resultBox').style.display = 'block';
        }

        loadQuestion();
    </script>
</body>
