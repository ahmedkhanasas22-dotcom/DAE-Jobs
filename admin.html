<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - DAE Jobs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #090d16; color: #cbd5e1; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .admin-container { width: 100%; max-width: 600px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { font-family: 'Outfit', sans-serif; color: #38bdf8; margin-bottom: 20px; font-size: 1.4rem; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; font-weight: 500; }
        input, select, textarea { width: 100%; background: #090d16; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; font-size: 13px; }
        input[type="file"] { padding: 8px; cursor: pointer; color: #38bdf8; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; outline: none; }
        textarea { resize: vertical; height: 100px; }
        
        .action-btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .action-btn:hover { background: #0369a1; }
        
        .secondary-btn { background: #334155; margin-top: 5px; }
        .secondary-btn:hover { background: #475569; }

        #statusMsg, #loginError { text-align: center; margin-top: 15px; font-size: 13px; font-weight: 500; }
        
        #jobFormSection { display: none; }
        
        .link-box { background: #090d16; border: 1px dashed #38bdf8; padding: 12px; border-radius: 6px; margin-top: 15px; display: none; text-align: center; }
        .link-box input { background: #111827; border: 1px solid #334155; color: #38bdf8; text-align: center; margin-bottom: 8px; font-weight: 600; }
        .copy-btn { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .copy-btn:hover { background: #059669; }

        .manage-section { margin-top: 30px; border-top: 1px solid #1f2937; padding-top: 20px; }
        .admin-job-card { background: #090d16; border: 1px solid #1f2937; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .admin-job-info h4 { color: #38bdf8; font-size: 13px; }
        .admin-job-info p { color: #64748b; font-size: 11px; }
        .admin-job-btns { display: flex; gap: 6px; }
        .btn-edit { background: #d97706; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-edit:hover { background: #b45309; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="admin-container">
        
        <!-- Login Box Section -->
        <div id="loginSection">
            <h2><i class="fa-solid fa-lock"></i> Admin Login</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUser" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="Enter password">
            </div>
            <button type="button" class="action-btn" onclick="checkLogin()">Login</button>
            <div id="loginError" style="color: #f87171;"></div>
        </div>

        <!-- Job Post / Edit Form Section -->
        <div id="jobFormSection">
            <h2 id="formHeading"><i class="fa-solid fa-cloud-arrow-up"></i> Post New Job</h2>
            <form id="jobForm">
                <input type="hidden" id="editJobId">
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="jobTitle" placeholder="e.g. Plant Maintenance Engineer" required>
                </div>
                <div class="form-group">
                    <label>Company / Organization Name</label>
                    <input type="text" id="companyName" placeholder="e.g. Fauji Fertilizer (FFC)" required>
                </div>
                <div class="form-group">
                    <label>DAE / Discipline Category</label>
                    <select id="jobCategory" required>
                        <option value="All">🌐 All Categories (Post to All Fields)</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Civil">Civil</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Chemical">Chemical</option>
                        <option value="Auto">Auto & Diesel</option>
                        <option value="CAD">Architecture/CAD</option>
                        <option value="IT">IT & Telecom</option>
                        <option value="Designing">Designing</option>
                        <option value="Nursing">Nursing/Medical</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-image"></i> Select Job Poster from Gallery (Optional)</label>
                    <input type="file" id="posterFile" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Apply Link (Website, Portal, or WhatsApp Direct Link)</label>
                    <input type="url" id="applyLink" placeholder="https://example.com/apply" required>
                </div>
                <div class="form-group">
                    <label>Job Description / Details</label>
                    <textarea id="jobDesc" placeholder="Enter full qualifications, experience required, and last date..." required></textarea>
                </div>
                
                <button type="submit" class="action-btn" id="submitBtn">Publish Job</button>
                <button type="button" id="cancelEditBtn" class="action-btn secondary-btn" style="display:none;" onclick="cancelEditMode()">Cancel Edit</button>
                
                <div id="statusMsg"></div>
                
                <div class="link-box" id="jobLinkBox">
                    <label style="color: #38bdf8; margin-bottom: 5px;">Direct Job Link (Click to Copy):</label>
                    <input type="text" id="shareableLink" readonly>
                    <button type="button" class="copy-btn" onclick="copyJobLink()"><i class="fa-solid fa-copy"></i> Copy Link</button>
                </div>
            </form>

            <div class="manage-section">
                <h3 style="font-size: 1rem; color: #38bdf8; margin-bottom: 12px;"><i class="fa-solid fa-list-check"></i> Manage Existing Jobs</h3>
                <div id="adminJobsList" style="max-height: 250px; overflow-y: auto;">
                    <p style="font-size: 12px; color: #64748b;">Loading jobs...</p>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCc8FitH2KT_3uqheu5u6wNwn4NTTE1sI",
            authDomain: "dae-jobs.firebaseapp.com",
            projectId: "dae-jobs",
            storageBucket: "dae-jobs.firebasestorage.app",
            messagingSenderId: "1016642189187",
            appId: "1:1016642189187:web:f21667388b1261290928b6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkLogin = function() {
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();
            
            if (user === "Ahmedkhan" && pass === "Ahmedkhanasas21") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('jobFormSection').style.display = 'block';
                loadAdminJobsList();
            } else {
                document.getElementById('loginError').innerText = "Incorrect Username or Password!";
            }
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        const MAX_WIDTH = 500;
                        const MAX_HEIGHT = 500;
                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        const form = document.getElementById('jobForm');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');
        const jobLinkBox = document.getElementById('jobLinkBox');
        const shareableLinkInput = document.getElementById('shareableLink');

        async function loadAdminJobsList() {
            const container = document.getElementById('adminJobsList');
            container.innerHTML = '<p style="font-size: 12px; color: #64748b;">Loading...</p>';
            
            try {
                const q = query(collection(db, "jobs"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                container.innerHTML = "";
                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="font-size: 12px; color: #64748b;">No jobs found.</p>';
                    return;
                }

                querySnapshot.forEach((documentSnap) => {
                    const job = documentSnap.data();
                    const jobId = documentSnap.id;

                    const item = document.createElement('div');
                    item.className = 'admin-job-card';
                    item.innerHTML = `
                        <div class="admin-job-info" style="max-width: 65%;">
                            <h4>${job.title}</h4>
                            <p>${job.company} | <span style="color:#f97316;">${job.category}</span></p>
                        </div>
                        <div class="admin-job-btns">
                            <button type="button" class="btn-edit" onclick="prepareEditJob('${jobId}', '${encodeURIComponent(job.title)}', '${encodeURIComponent(job.company)}', '${job.category}', '${encodeURIComponent(job.applyLink)}', '${encodeURIComponent(job.description)}')">Edit</button>
                            <button type="button" class="btn-delete" onclick="deleteJob('${jobId}')">Delete</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="font-size: 12px; color: #f87171;">Failed to load jobs list.</p>';
            }
        }

        window.deleteJob = async function(jobId) {
            if (confirm("کیا آپ واقعی اس جاب کو ہمیشہ کے لیے ڈیلیट کرنا چاہتے ہیں؟")) {
                try {
                    await deleteDoc(doc(db, "jobs", jobId));
                    alert("جابس کامیابی سے ڈیلیਟ ہو گئی!");
                    loadAdminJobsList();
                } catch (err) {
                    console.error(err);
                    alert("ڈیلیट کرنے میں خرابی پیش آئی۔");
                }
            }
        }

        window.prepareEditJob = function(id, title, company, category, applyLink, desc) {
            document.getElementById('editJobId').value = id;
            document.getElementById('jobTitle').value = decodeURIComponent(title);
            document.getElementById('companyName').value = decodeURIComponent(company);
            document.getElementById('jobCategory').value = category;
            document.getElementById('applyLink').value = decodeURIComponent(applyLink);
            document.getElementById('jobDesc').value = decodeURIComponent(desc);
            
            document.getElementById('formHeading').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit Job';
            submitBtn.innerText = "Update Job";
            document.getElementById('cancelEditBtn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelEditMode = function() {
            form.reset();
            document.getElementById('editJobId').value = "";
            document.getElementById('formHeading').innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Post New Job';
            submitBtn.innerText = "Publish Job";
            document.getElementById('cancelEditBtn').style.display = "none";
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            
            const editId = document.getElementById('editJobId').value;
            const title = document.getElementById('jobTitle').value;
            const company = document.getElementById('companyName').value;
            const category = document.getElementById('jobCategory').value;
            const applyLink = document.getElementById('applyLink').value;
            const description = document.getElementById('jobDesc').value;
            const fileInput = document.getElementById('posterFile');

            let posterUrl = "";
            try {
                if (fileInput.files && fileInput.files[0]) {
                    submitBtn.innerText = "Processing Image...";
                    statusMsg.style.color = "#38bdf8";
                    statusMsg.innerText = "Compressing image...";
                    posterUrl = await compressImage(fileInput.files[0]);
                }

                if (editId) {
                    submitBtn.innerText = "Updating Job...";
                    statusMsg.style.color = "#38bdf8";
                    statusMsg.innerText = "Updating job details...";

                    let updateData = {
                        title: title,
                        company: company,
                        category: category,
                        applyLink: applyLink,
                        description: description
                    };
                    if (posterUrl) {
                        updateData.posterUrl = posterUrl;
                    }

                    await updateDoc(doc(db, "jobs", editId), updateData);
                    
                    alert("جابس کامیابی سے اپڈیٹ ہو گئی ہے!");
                    cancelEditMode();
                    statusMsg.innerText = "";
                    loadAdminJobsList();

                } else {
                    submitBtn.innerText = "Publishing...";
                    statusMsg.style.color = "#38bdf8";
                    statusMsg.innerText = "Uploading to database...";
                    jobLinkBox.style.display = 'none';

                    const options = { month: 'short', day: 'numeric', year: 'numeric' };
                    const currentDate = new Date().toLocaleDateString('en-US', options);
                    const timestampVal = Date.now();
                    let firstDocId = "";

                    if (category === "All") {
                        const allCategories = [
                            "Mechanical", "Electrical", "Civil", "Electronics", 
                            "Chemical", "Auto", "CAD", "IT", "Designing", "Nursing"
                        ];

                        // اب تمام کیٹगरीز ایک ساتھ سیکنڈوں میں اپ لوڈ ہوں گی (فاسٹ موڈ)
                        const uploadPromises = allCategories.map(async (cat, index) => {
                            const docRef = await addDoc(collection(db, "jobs"), {
                                title: title, company: company, category: cat,
                                posterUrl: posterUrl, applyLink: applyLink, description: description,
                                date: currentDate, timestamp: timestampVal
                            });
                            if (index === 0) firstDocId = docRef.id;
                        });

                        await Promise.all(uploadPromises);

                    } else {
                        const docRef = await addDoc(collection(db, "jobs"), {
                            title: title, company: company, category: category,
                            posterUrl: posterUrl, applyLink: applyLink, description: description,
                            date: currentDate, timestamp: timestampVal
                        });
                        firstDocId = docRef.id;
                    }

                    statusMsg.style.color = "#4ade80";
                    statusMsg.innerText = "Job Published Successfully!";
                    
                    const baseUrl = window.location.href.replace('admin.html', 'index.html');
                    shareableLinkInput.value = `${baseUrl}?id=${firstDocId}`;
                    jobLinkBox.style.display = 'block';
                    
                    form.reset();
                    loadAdminJobsList();
                }

            } catch (error) {
                console.error("Error: ", error);
                statusMsg.style.color = "#f87171";
                statusMsg.innerText = "Error: " + (error.message || "Failed");
            } finally {
                submitBtn.disabled = false;
                if (!document.getElementById('editJobId').value) {
                    submitBtn.innerText = "Publish Job";
                }
            }
        });

        window.copyJobLink = function() {
            shareableLinkInput.select();
            shareableLinkInput.setSelectionRange(0, 99999);
            try {
                navigator.clipboard.writeText(shareableLinkInput.value).then(() => {
                    alert("Job Link Copied Successfully!");
                });
            } catch (err) {
                alert("Link selected! Copy manually.");
            }
        }
    </script>
</body>
</html>
