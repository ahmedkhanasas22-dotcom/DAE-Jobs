<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DAE Jobs Pakistan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #090d16; color: #cbd5e1; padding-bottom: 40px; }

        header {
            background: #0f172a; border-bottom: 1px solid #1e293b; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .logo { font-family: 'Outfit', sans-serif; font-size: 18px; color: #38bdf8; font-weight: 800; }
        .logo span { color: #f97316; }
        .badge { font-size: 11px; background: #ef4444; padding: 4px 10px; border-radius: 6px; color: white; font-weight: 600; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h2 { font-family: 'Outfit', sans-serif; font-size: 1.1rem; color: #38bdf8; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; font-weight: 500; }
        .form-control {
            width: 100%; background: #090d16; border: 1px solid #334155; border-radius: 8px;
            padding: 10px 12px; color: white; font-size: 13px; outline: none; transition: 0.2s;
        }
        .form-control:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.2); }
        textarea.form-control { resize: vertical; min-height: 90px; }

        .btn {
            background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: #0369a1; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-warning { background: #f59e0b; color: #000; }
        .btn-warning:hover { background: #d97706; }

        /* Admin Jobs List Styles */
        .admin-job-item {
            background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 12px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .admin-job-info h4 { color: #fff; font-size: 14px; margin-bottom: 3px; }
        .admin-job-info p { color: #64748b; font-size: 11px; }
        .admin-actions { display: flex; gap: 6px; }
        
        .loading { text-align: center; color: #94a3b8; padding: 15px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">DAE <span>ADMIN PANEL</span></div>
        <div class="badge">Restricted Access</div>
    </header>

    <div class="container">
        
        <!-- Post New Job Card -->
        <div class="card">
            <h2 id="formTitle"><i class="fa-solid fa-circle-plus"></i> Post New Job</h2>
            <form id="jobForm">
                <input type="hidden" id="editJobId">
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="jobTitle" class="form-control" placeholder="e.g. Mechanical Supervisor" required>
                </div>
                <div class="form-group">
                    <label>Company / Department</label>
                    <input type="text" id="jobCompany" class="form-control" placeholder="e.g. Fauji Fertilizer / WAPDA" required>
                </div>
                <div class="form-group">
                    <label>Discipline Category</label>
                    <select id="jobCategory" class="form-control" required>
                        <option value="">Select Category</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Civil">Civil</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Chemical">Chemical</option>
                        <option value="Auto">Auto & Diesel</option>
                        <option value="CAD">Architecture/CAD</option>
                        <option value="IT">IT & Telecom</option>
                        <option value="Designing">Designing</option>
                        <option value="Nursing">Nursing/Medical</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Poster Image URL (Optional)</label>
                    <input type="url" id="jobPoster" class="form-control" placeholder="Paste image link here">
                </div>
                <div class="form-group">
                    <label>Job Description / Details</label>
                    <textarea id="jobDesc" class="form-control" placeholder="Write requirements, last date, etc..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Apply Link / WhatsApp Link</label>
                    <input type="url" id="jobApply" class="form-control" placeholder="https://..." required>
                </div>
                <button type="submit" class="btn" id="submitBtn"><i class="fa-solid fa-paper-plane"></i> Publish Job</button>
                <button type="button" class="btn btn-danger" id="cancelEditBtn" style="display:none; margin-left: 8px;" onclick="resetForm()">Cancel Edit</button>
            </form>
        </div>

        <!-- Manage Existing Jobs Card -->
        <div class="card">
            <h2><i class="fa-solid fa-list-check"></i> Manage Existing Jobs</h2>
            <div id="adminJobsContainer">
                <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading jobs...</div>
            </div>
        </div>

    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCc8FitH2KT_3uqheu5u6wNwn4NTTE1sI",
            authDomain: "dae-jobs.firebaseapp.com",
            projectId: "dae-jobs",
            storageBucket: "dae-jobs.firebasestorage.app",
            messagingSenderId: "1016642189187",
            appId: "1:1016642189187:web:f21667388b1261290928b6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allAdminJobs = [];

        // Fetch Jobs for Admin Panel
        async function fetchAdminJobs() {
            const container = document.getElementById('adminJobsContainer');
            try {
                const q = query(collection(db, "jobs"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                container.innerHTML = "";
                allAdminJobs = [];

                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="loading">No jobs found in database.</div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const job = docSnap.data();
                    job.id = docSnap.id;
                    allAdminJobs.push(job);

                    const item = document.createElement('div');
                    item.className = 'admin-job-item';
                    item.innerHTML = `
                        <div class="admin-job-info">
                            <h4>${job.title}</h4>
                            <p>${job.company} | <b>${job.category}</b></p>
                        </div>
                        <div class="admin-actions">
                            <button class="btn btn-warning" onclick="window.editJob('${job.id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-danger" onclick="window.deleteJob('${job.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    container.appendChild(item);
                });

            } catch (error) {
                console.error("Error loading admin jobs:", error);
                container.innerHTML = '<div class="loading" style="color:#ef4444;">Error loading jobs from Firebase.</div>';
            }
        }

        // Handle Form Submit (Add or Update)
        document.getElementById('jobForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editJobId').value;
            const submitBtn = document.getElementById('submitBtn');
            
            const jobData = {
                title: document.getElementById('jobTitle').value,
                company: document.getElementById('jobCompany').value,
                category: document.getElementById('jobCategory').value,
                posterUrl: document.getElementById('jobPoster').value,
                description: document.getElementById('jobDesc').value,
                applyLink: document.getElementById('jobApply').value,
                date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
                timestamp: Date.now()
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

            try {
                if (editId) {
                    // Update Job
                    await updateDoc(doc(db, "jobs", editId), jobData);
                    alert("Job updated successfully!");
                } else {
                    // Add New Job
                    await addDoc(collection(db, "jobs"), jobData);
                    alert("Job posted successfully!");
                }
                resetForm();
                fetchAdminJobs();
            } catch (error) {
                console.error("Error saving job: ", error);
                alert("Failed to save job. Check console.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish Job';
            }
        });

        // Delete Job Function
        window.deleteJob = async function(id) {
            if (confirm("Are you sure you want to delete this job?")) {
                try {
                    await deleteDoc(doc(db, "jobs", id));
                    alert("Job deleted successfully!");
                    fetchAdminJobs();
                } catch (error) {
                    console.error("Error deleting job:", error);
                    alert("Failed to delete job.");
                }
            }
        }

        // Edit Job Function
        window.editJob = function(id) {
            const job = allAdminJobs.find(j => j.id === id);
            if (!job) return;

            document.getElementById('editJobId').value = job.id;
            document.getElementById('jobTitle').value = job.title;
            document.getElementById('jobCompany').value = job.company;
            document.getElementById('jobCategory').value = job.category;
            document.getElementById('jobPoster').value = job.posterUrl || '';
            document.getElementById('jobDesc').value = job.description;
            document.getElementById('jobApply').value = job.applyLink;

            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit Job Posting';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-check"></i> Update Job';
            document.getElementById('cancelEditBtn').style.display = 'inline-flex';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset Form Function
        window.resetForm = function() {
            document.getElementById('jobForm').reset();
            document.getElementById('editJobId').value = '';
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-circle-plus"></i> Post New Job';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish Job';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        // Load jobs on startup
        fetchAdminJobs();
    </script>
</body>
</html>
