<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - DAE Jobs & Test Prep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.0.2/tesseract.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #090d16; color: #cbd5e1; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .admin-container { width: 100%; max-width: 650px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { font-family: 'Outfit', sans-serif; color: #38bdf8; margin-bottom: 20px; font-size: 1.4rem; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; font-weight: 500; }
        input, select, textarea { width: 100%; background: #090d16; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; font-size: 13px; }
        input[type="file"] { padding: 8px; cursor: pointer; color: #38bdf8; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; outline: none; }
        textarea { resize: vertical; height: 100px; }
        
        .action-btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .action-btn:hover { background: #0369a1; }
        
        .secondary-btn { background: #334155; margin-top: 5px; }
        .secondary-btn:hover { background: #475569; }

        .tab-switcher { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #1f2937; padding-bottom: 15px; }
        .tab-btn { flex: 1; background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; transition: 0.2s; text-align: center; }
        .tab-btn.active { background: #0284c7; border-color: #38bdf8; color: white; }

        #statusMsg, #loginError, #prepStatusMsg { text-align: center; margin-top: 15px; font-size: 13px; font-weight: 500; }
        
        #jobFormSection { display: none; }
        .admin-section-content { display: none; }
        .admin-section-content.active { display: block; }

        .link-box { background: #090d16; border: 2px dashed #38bdf8; padding: 12px; border-radius: 6px; margin-top: 15px; display: none; text-align: center; }
        .link-box input { background: #0f172a !important; color: #38bdf8 !important; text-align: center; margin-bottom: 8px; font-weight: 700; border: 1px solid #38bdf8 !important; font-size: 12px; -webkit-text-fill-color: #38bdf8 !important; opacity: 1 !important; }
        
        .copy-btn { background: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: 600; width: 100%; }
        .copy-btn:hover { background: #059669; }

        .manage-section { margin-top: 30px; border-top: 1px solid #1f2937; padding-top: 20px; }
        .admin-job-card { background: #090d16; border: 1px solid #1f2937; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .admin-job-info h4 { color: #38bdf8; font-size: 13px; }
        .admin-job-info p { color: #64748b; font-size: 11px; }
        .admin-job-btns { display: flex; gap: 6px; }
        .btn-edit { background: #d97706; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-edit:hover { background: #b45309; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="admin-container">
        
        <div id="loginSection">
            <h2><i class="fa-solid fa-lock"></i> Admin Login</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUser" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="Enter password">
            </div>
            <button type="button" class="action-btn" onclick="checkLogin()">Login</button>
            <div id="loginError" style="color: #f87171;"></div>
        </div>

        <div id="jobFormSection">
            <h2><i class="fa-solid fa-gauge-high"></i> Admin Dashboard</h2>
            
            <div class="tab-switcher">
                <button type="button" class="tab-btn active" id="tabJobBtn" onclick="switchAdminTab('job')"><i class="fa-solid fa-briefcase"></i> Post/Manage Jobs</button>
                <button type="button" class="tab-btn" id="tabPrepBtn" onclick="switchAdminTab('prep')"><i class="fa-solid fa-book-open"></i> Add MCQs / Test Book</button>
            </div>

            <div id="jobAdminTab" class="admin-section-content active">
                <h3 id="formHeading" style="font-size: 1rem; color: #38bdf8; margin-bottom: 12px;"><i class="fa-solid fa-cloud-arrow-up"></i> Post New Job</h3>
                <form id="jobForm">
                    <input type="hidden" id="editJobId">
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" id="jobTitle" placeholder="e.g. Plant Maintenance Engineer" required>
                    </div>
                    <div class="form-group">
                        <label>Company / Organization Name</label>
                        <input type="text" id="companyName" placeholder="e.g. Fauji Fertilizer (FFC)" required>
                    </div>
                    <div class="form-group">
                        <label>DAE / Discipline Category</label>
                        <select id="jobCategory" required>
                            <option value="All">🌐 All Categories</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Electrical">Electrical</option>
                            <option value="Civil">Civil</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Chemical">Chemical</option>
                            <option value="Auto">Auto & Diesel</option>
                            <option value="CAD">Architecture/CAD</option>
                            <option value="IT">IT & Telecom</option>
                            <option value="Designing">Designing</option>
                            <option value="Nursing">Nursing/Medical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-image"></i> Select Job Poster (Optional)</label>
                        <input type="file" id="posterFile" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>Apply Link</label>
                        <input type="url" id="applyLink" placeholder="https://example.com/apply" required>
                    </div>
                    <div class="form-group">
                        <label>Job Description / Details</label>
                        <textarea id="jobDesc" placeholder="Enter full qualifications..." required></textarea>
                    </div>
                    
                    <button type="submit" class="action-btn" id="submitBtn">Publish Job</button>
                    <button type="button" id="cancelEditBtn" class="action-btn secondary-btn" style="display:none;" onclick="cancelEditMode()">Cancel Edit</button>
                    
                    <div id="statusMsg"></div>
                    
                    <div class="link-box" id="jobLinkBox">
                        <label style="color: #38bdf8; margin-bottom: 5px; font-weight: bold;">Direct Job Link Generated:</label>
                        <input type="text" id="shareableLink" readonly>
                        <button type="button" class="copy-btn" onclick="copyLink('shareableLink')"><i class="fa-solid fa-copy"></i> Click Here to Copy Job Link</button>
                    </div>
                </form>

                <div class="manage-section">
                    <h3 style="font-size: 1rem; color: #38bdf8; margin-bottom: 12px;"><i class="fa-solid fa-list-check"></i> Manage Existing Jobs</h3>
                    <div id="adminJobsList" style="max-height: 250px; overflow-y: auto;">
                        <p style="font-size: 12px; color: #64748b;">Loading jobs...</p>
                    </div>
                </div>
            </div>

            <div id="prepAdminTab" class="admin-section-content">
                <h3 style="font-size: 1rem; color: #38bdf8; margin-bottom: 12px;"><i class="fa-solid fa-book-medical"></i> Smart Auto-MCQs Extractor</h3>
                <p style="font-size: 11px; color: #94a3b8; margin-bottom: 12px;">کوئی بھی فائل (CSV/Excel) یا کتاب/نوٹس کی تصویر (Picture/Screenshot) اپ لوڈ کریں؛ سسٹم خود بخود سوالات نکال کر ٹیسٹ بنا دے گا۔</p>
                <form id="prepForm">
                    <div class="form-group">
                        <label>Select Discipline Category</label>
                        <select id="prepCategory" required>
                            <option value="Electrical">Electrical Technology</option>
                            <option value="Mechanical">Mechanical Technology</option>
                            <option value="Civil">Civil Technology</option>
                            <option value="Electronics">Electronics Technology</option>
                            <option value="Chemical">Chemical Technology</option>
                            <option value="IT">IT & Computer Science</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Book Code / Subject Name</label>
                        <input type="text" id="bookName" placeholder="e.g. ACET-336 (AC Machines)" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-file-arrow-up"></i> Upload Any File or Picture (CSV, Excel, Image, Screenshot)</label>
                        <input type="file" id="universalFile" accept=".csv, .xlsx, .xls, image/*" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-file-pdf"></i> Upload Downloadable PDF Notes (Optional)</label>
                        <input type="file" id="notesFile" accept=".pdf">
                    </div>
                    
                    <button type="submit" class="action-btn" id="submitPrepBtn">Auto-Extract & Publish MCQs</button>
                    <div id="prepStatusMsg"></div>

                    <div class="link-box" id="prepLinkBox">
                        <label style="color: #38bdf8; margin-bottom: 5px; font-weight: bold;">Direct Test Link Generated:</label>
                        <input type="text" id="prepShareableLink" readonly>
                        <button type="button" class="copy-btn" onclick="copyLink('prepShareableLink')"><i class="fa-solid fa-copy"></i> Click Here to Copy Test Link</button>
                    </div>
                </form>
            </div>

        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCc8FitH2KT_3uqheu5u6wNwn4NTTE1sI",
            authDomain: "dae-jobs.firebaseapp.com",
            projectId: "dae-jobs",
            storageBucket: "dae-jobs.firebasestorage.app",
            messagingSenderId: "1016642189187",
            appId: "1:1016642189187:web:f21667388b1261290928b6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkLogin = function() {
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();
            if (user === "Ahmedkhan" && pass === "Ahmedkhanasas21") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('jobFormSection').style.display = 'block';
                loadAdminJobsList();
            } else {
                document.getElementById('loginError').innerText = "Incorrect Username or Password!";
            }
        }

        window.switchAdminTab = function(tabName) {
            const jobTab = document.getElementById('jobAdminTab');
            const prepTab = document.getElementById('prepAdminTab');
            const btnJob = document.getElementById('tabJobBtn');
            const btnPrep = document.getElementById('tabPrepBtn');

            if (tabName === 'job') {
                jobTab.classList.add('active');
                prepTab.classList.remove('active');
                btnJob.classList.add('active');
                btnPrep.classList.remove('active');
            } else {
                prepTab.classList.add('active');
                jobTab.classList.remove('active');
                btnPrep.classList.add('active');
                btnJob.classList.remove('active');
            }
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > 500) { height *= 500 / width; width = 500; }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        const form = document.getElementById('jobForm');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');
        const jobLinkBox = document.getElementById('jobLinkBox');
        const shareableLinkInput = document.getElementById('shareableLink');

        async function loadAdminJobsList() {
            const container = document.getElementById('adminJobsList');
            container.innerHTML = '<p style="font-size: 12px; color: #64748b;">Loading...</p>';
            try {
                const q = query(collection(db, "jobs"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                container.innerHTML = "";
                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="font-size: 12px; color: #64748b;">No jobs found.</p>';
                    return;
                }
                querySnapshot.forEach((documentSnap) => {
                    const job = documentSnap.data();
                    const jobId = documentSnap.id;
                    const item = document.createElement('div');
                    item.className = 'admin-job-card';
                    item.innerHTML = `
                        <div class="admin-job-info" style="max-width: 65%;">
                            <h4>${job.title}</h4>
                            <p>${job.company} | <span style="color:#f97316;">${job.category}</span></p>
                        </div>
                        <div class="admin-job-btns">
                            <button type="button" class="btn-edit" onclick="prepareEditJob('${jobId}', '${encodeURIComponent(job.title)}', '${encodeURIComponent(job.company)}', '${job.category}', '${encodeURIComponent(job.applyLink)}', '${encodeURIComponent(job.description)}')">Edit</button>
                            <button type="button" class="btn-delete" onclick="deleteJob('${jobId}')">Delete</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                container.innerHTML = '<p style="font-size: 12px; color: #f87171;">Failed to load jobs list.</p>';
            }
        }

        window.deleteJob = async function(jobId) {
            if (confirm("کیا آپ واقعی اس جاب کو ڈیلیट کرنا چاہتے ہیں؟")) {
                await deleteDoc(doc(db, "jobs", jobId));
                loadAdminJobsList();
            }
        }

        window.prepareEditJob = function(id, title, company, category, applyLink, desc) {
            document.getElementById('editJobId').value = id;
            document.getElementById('jobTitle').value = decodeURIComponent(title);
            document.getElementById('companyName').value = decodeURIComponent(company);
            document.getElementById('jobCategory').value = category;
            document.getElementById('applyLink').value = decodeURIComponent(applyLink);
            document.getElementById('jobDesc').value = decodeURIComponent(desc);
            document.getElementById('formHeading').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit Job';
            submitBtn.innerText = "Update Job";
            document.getElementById('cancelEditBtn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelEditMode = function() {
            form.reset();
            document.getElementById('editJobId').value = "";
            document.getElementById('formHeading').innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Post New Job';
            submitBtn.innerText = "Publish Job";
            document.getElementById('cancelEditBtn').style.display = "none";
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            const editId = document.getElementById('editJobId').value;
            const title = document.getElementById('jobTitle').value;
            const company = document.getElementById('companyName').value;
            const category = document.getElementById('jobCategory').value;
            const applyLink = document.getElementById('applyLink').value;
            const description = document.getElementById('jobDesc').value;
            const fileInput = document.getElementById('posterFile');

            let posterUrl = "";
            try {
                if (fileInput.files && fileInput.files[0]) {
                    posterUrl = await compressImage(fileInput.files[0]);
                }
                if (editId) {
                    let updateData = { title, company, category, applyLink, description };
                    if (posterUrl) updateData.posterUrl = posterUrl;
                    await updateDoc(doc(db, "jobs", editId), updateData);
                    cancelEditMode();
                    loadAdminJobsList();
                } else {
                    const docRef = await addDoc(collection(db, "jobs"), {
                        title, company, category, posterUrl, applyLink, description,
                        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                        timestamp: Date.now()
                    });
                    const currentUrl = window.location.href;
                    const cleanBaseUrl = currentUrl.split('?')[0].replace('admin.html', 'index.html');
                    jobLinkBox.style.display = 'block';
                    shareableLinkInput.value = `${cleanBaseUrl}?id=${docRef.id}`;
                    form.reset();
                    loadAdminJobsList();
                }
            } catch (error) {
                statusMsg.innerText = "Error: " + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Publish Job";
            }
        });

        // Smart Universal MCQs & Picture Extractor Form Handler
        const prepForm = document.getElementById('prepForm');
        const prepStatusMsg = document.getElementById('prepStatusMsg');
        const submitPrepBtn = document.getElementById('submitPrepBtn');
        const prepLinkBox = document.getElementById('prepLinkBox');
        const prepShareableLinkInput = document.getElementById('prepShareableLink');

        prepForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitPrepBtn.disabled = true;
            submitPrepBtn.innerText = "Processing File / Picture...";
            prepStatusMsg.style.color = "#38bdf8";
            prepStatusMsg.innerText = "Analyzing content and extracting MCQs...";
            prepLinkBox.style.display = 'none';

            try {
                const category = document.getElementById('prepCategory').value;
                const bookName = document.getElementById('bookName').value;
                const fileInput = document.getElementById('universalFile').files[0];
                const notesFileInput = document.getElementById('notesFile').files[0];
                
                let notesPdfData = "";
                if (notesFileInput) {
                    notesPdfData = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(notesFileInput);
                    });
                }

                let csvContent = "";

                if (fileInput.type.startsWith('image/')) {
                    prepStatusMsg.innerText = "Reading text from image using OCR...";
                    const worker = await Tesseract.createWorker('eng');
                    await worker.load();
                    await worker.loadLanguage('eng');
                    await worker.initialize('eng');
                    const ret = await worker.recognize(fileInput);
                    await worker.terminate();

                    const rawText = ret.data.text;
                    const lines = rawText.split('\n').filter(l => l.trim().length > 3);
                    let parsedRows = ["Topic,Question Number,Last Revision (Date),Type of Question / Task,Question / Task,Answer 1 ,Correct (1) / Incorrect (0),Answer 2,Correct (1) / Incorrect (0),Answer 3,Correct (1) / Incorrect (0),Answer 4,Correct (1) / Incorrect (0)"];
                    
                    for (let i = 0; i < lines.length; i++) {
                        let line = lines[i].trim();
                        if (line.includes('?') || line.length > 15) {
                            let q = line.replace(/,/g, " ");
                            let optA = lines[i+1] ? lines[i+1].replace(/^[a-dA-D][).] */, "").replace(/,/g, " ") : "Option A";
                            let optB = lines[i+2] ? lines[i+2].replace(/^[a-dA-D][).] */, "").replace(/,/g, " ") : "Option B";
                            let optC = lines[i+3] ? lines[i+3].replace(/^[a-dA-D][).] */, "").replace(/,/g, " ") : "Option C";
                            let optD = lines[i+4] ? lines[i+4].replace(/^[a-dA-D][).] */, "").replace(/,/g, " ") : "Option D";
                            parsedRows.push(`General,${i+1},2026-01-01,MC,"${q}","${optA}",1,"${optB}",0,"${optC}",0,"${optD}",0`);
                        }
                    }
                    csvContent = parsedRows.join('\n');
                } else {
                    csvContent = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (event) => resolve(event.target.result);
                        reader.readAsText(fileInput);
                    });
                }

                const docRef = await addDoc(collection(db, "testBooks"), {
                    category: category,
                    bookName: bookName,
                    csvData: csvContent,
                    notesPdf: notesPdfData,
                    timestamp: Date.now()
                });

                prepStatusMsg.style.color = "#4ade80";
                prepStatusMsg.innerText = "✅ MCQs Extracted & Published Successfully!";
                
                const currentUrl = window.location.href;
                const cleanBaseUrl = currentUrl.split('?')[0].replace('admin.html', 'index.html');
                
                setTimeout(() => {
                    prepLinkBox.linkBox = 'block';
                    prepLinkBox.style.display = 'block';
                    prepShareableLinkInput.value = `${cleanBaseUrl}?book=${docRef.id}`;
                    prepShareableLinkInput.select();
                }, 100);

                prepForm.reset();
            } catch (err) {
                console.error(err);
                prepStatusMsg.style.color = "#f87171";
                prepStatusMsg.innerText = "Error: " + err.message;
            } finally {
                submitPrepBtn.disabled = false;
                submitPrepBtn.innerText = "Auto-Extract & Publish MCQs";
            }
        });

        window.copyLink = function(elementId) {
            const inputField = document.getElementById(elementId);
            inputField.select();
            inputField.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(inputField.value).then(() => {
                alert("✅ Link Copied Successfully!");
            });
        }
    </script>
</body>
</html>
