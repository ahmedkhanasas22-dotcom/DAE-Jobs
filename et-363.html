    let currentIdx = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        const q = quizData[currentIdx];
        document.getElementById('question-number').innerText = `Question ${currentIdx + 1} of ${quizData.length}`;
        document.getElementById('question-title').innerText = q.question;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const li = document.createElement('li');
            li.innerText = opt;
            li.onclick = () => selectOption(index, li);
            optionsContainer.appendChild(li);
        });

        document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(selectedIndex, element) {
        if (answered) return;
        answered = true;

        const q = quizData[currentIdx];
        const optionsList = document.getElementById('options-container').children;

        if (selectedIndex === q.correct) {
            element.classList.add('correct');
            score++;
        } else {
            element.classList.add('incorrect');
            optionsList[q.correct].classList.add('correct');
        }

        for (let li of optionsList) {
            li.classList.add('disabled');
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
        } else {
            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('score-box').style.display = 'block';
            document.getElementById('final-score').innerText = `آپ کا سکور: ${score} / ${quizData.length}`;
        }
    }

    function restartQuiz() {
        currentIdx = 0;
        score = 0;
        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('score-box').style.display = 'none';
        loadQuestion();
    }

    // Initialize quiz
    loadQuestion();
