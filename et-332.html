            margin-bottom: 4px;
        }

        .main-title p {

            color: var(--text-muted);
        }

        .quiz-card {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .question-box {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-item {
            background: var(--option-bg);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .option-item:hover:not(.disabled) {
            background: var(--option-hover);
            border-color: var(--accent-blue);
        }

        .option-item.correct {
            background: rgba(35, 134, 54, 0.2);
            border-color: var(--accent-green);
            color: #3fb950;
        }

        .option-item.incorrect {
            background: rgba(218, 54, 51, 0.2);
            border-color: var(--accent-red);
            color: #f85149;
        }

        .option-item.disabled {
            cursor: default;
        }

        .quiz-footer {
            display: flex;
            justify-content: flex-end;
        }

        .btn {
            background-color: var(--accent-blue);
            color: #0d1117;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: none;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #79c0ff;
        }

        .result-screen {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .score-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent-blue);
            margin: 15px 0;

                ]
            },
            {
                "topic": "Energy Conservation",
                "question": "Overall goal of energy conservation: (انرجی کنزرویشن کا مجموعی ہدف:)",
                "options": [
                    { "text": "A) Sustainable future and resource preservation (پائیدار مستقبل اور وسائل کا تحفظ)", "correct": 1 },
                    { "text": "B) Increased wastage (زیادہ ضیاع)", "correct": 0 },
                    { "text": "C) Higher emissions (زیادہ اخراج)", "correct": 0 },
                    { "text": "D) Higher bills (زیادہ بل)", "correct": 0 }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const quizScreen = document.getElementById('quizScreen');
        const resultScreen = document.getElementById('resultScreen');
        const questionText = document.getElementById('questionText');
        const optionsList = document.getElementById('optionsList');
        const questionCount = document.getElementById('questionCount');
        const topicName = document.getElementById('topicName');
        const nextBtn = document.getElementById('nextBtn');
        const finalScore = document.getElementById('finalScore');
        const resultMessage = document.getElementById('resultMessage');

        function loadQuestion() {
            answered = false;
            nextBtn.style.display = 'none';
            const currentQ = quizData[currentQuestionIndex];
            
            questionCount.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            topicName.textContent = `Topic: ${currentQ.topic}`;
            questionText.textContent = currentQ.question;
            
            optionsList.innerHTML = '';
            currentQ.options.forEach((option, index) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.textContent = option.text;
                li.onclick = () => selectOption(index, li);
                optionsList.appendChild(li);
            });
        }

        function selectOption(selectedIndex, element) {
            if (answered) return;
            answered = true;

            const currentQ = quizData[currentQuestionIndex];
            const options = optionsList.children;

            if (currentQ.options[selectedIndex].correct === 1) {
                element.classList.add('correct');
                score++;
            } else {
                element.classList.add('incorrect');
                for (let i = 0; i < currentQ.options.length; i++) {
                    if (currentQ.options[i].correct === 1) {
                        options[i].classList.add('correct');
                        break;
                    }
                }
            }

            for (let opt of options) {
                opt.classList.add('disabled');
            }

            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            finalScore.textContent = `${score} / ${quizData.length}`;
            
            let percentage = (score / quizData.length) * 100;
            if (percentage >= 80) {
                resultMessage.textContent = "شاندار کارکردگی! آپ نے بہت اچھے نمبر حاصل کیے ہیں۔";
            } else if (percentage >= 50) {
                resultMessage.textContent = "بہت اچھا! آپ نے ٹیسٹ اچھے طریقے سے پاس کر لیا ہے۔";
            } else {
                resultMessage.textContent = "مزید محنت کی ضرورت ہے۔ آپ دوبارہ ٹیسٹ کی کوشش کر سکتے ہیں۔";
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            loadQuestion();
        }

        loadQuestion();
    </script>
